name: Optional LeRobot ACT CPU compatibility

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lerobot-compat.yml"
      - "projects/laundrybench/pyproject.toml"
      - "projects/laundrybench/src/laundrybench/policies/act.py"
      - "projects/laundrybench/tests/optional/test_lerobot_act_smoke.py"
  pull_request:
    paths:
      - ".github/workflows/lerobot-compat.yml"
      - "projects/laundrybench/pyproject.toml"
      - "projects/laundrybench/src/laundrybench/policies/act.py"
      - "projects/laundrybench/tests/optional/test_lerobot_act_smoke.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-act-smoke:
    name: LeRobot 0.6.1 ACT CPU smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/laundrybench/pyproject.toml
      - name: Install pinned CPU PyTorch wheels
        run: >-
          python -m pip install
          torch==2.7.1 torchvision==0.22.1
          --index-url https://download.pytorch.org/whl/cpu
      - name: Install LaundryBench and LeRobot training extra
        run: >-
          python -m pip install
          -e 'projects/laundrybench[dev]'
          'lerobot[training]==0.6.1'
      - name: Pin TorchCodec for PyTorch 2.7.1 CPU
        run: >-
          python -m pip install 'torchcodec==0.5.0'
          --index-url https://download.pytorch.org/whl/cpu
      - name: Confirm isolated CPU dependency versions
        run: |
          python - <<'PY'
          from importlib.metadata import version
          import torch
          import torchvision
          import torchcodec

          assert version("lerobot") == "0.6.1"
          assert version("torchcodec") in {"0.5", "0.5.0"}
          assert torch.__version__.startswith("2.7.1+cpu")
          assert torchvision.__version__.startswith("0.22.1+cpu")
          assert not torch.cuda.is_available()
          print(f"lerobot={version('lerobot')}")
          print(f"torch={torch.__version__}; cuda_available={torch.cuda.is_available()}")
          print(f"torchvision={torchvision.__version__}")
          print(f"torchcodec={version('torchcodec')}")
          PY
      - name: Run actual LeRobot ACT checkpoint and adapter smoke
        run: >-
          python -m pytest
          projects/laundrybench/tests/optional/test_lerobot_act_smoke.py
          -q
