name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install LaundryBench
        run: make install
      - name: Install FFmpeg for evidence capture checks
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Lint, test, and script smoke checks
        run: make check
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: projects/laundrybench/frontend/package-lock.json
      - name: Install frontend
        run: make frontend-install
      - name: Frontend behavior, typecheck and build
        run: make frontend-check
      - name: Reproducible mock UI dataset
        run: make web-demo
