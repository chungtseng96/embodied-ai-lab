name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install LaundryBench
        run: make install
      # Same command developers run locally. Do not add steps here that
      # `make check` does not run.
      - name: Gate
        run: make check
