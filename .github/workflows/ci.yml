name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install LaundryBench
        run: python -m pip install -e "projects/laundrybench[dev]"
      - name: Lint
        run: python -m ruff check projects/laundrybench
      - name: Test
        run: python -m pytest projects/laundrybench/tests
