name: Browser acceptance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install LaundryBench
        run: python -m pip install -e projects/laundrybench
      - name: Install and build frontend
        working-directory: projects/laundrybench/frontend
        run: npm ci && npm run build
      - name: Install browser harness
        working-directory: projects/laundrybench/e2e
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: projects/laundrybench/e2e
        run: npx playwright install --with-deps chromium
      - name: Run real-backend browser acceptance
        working-directory: projects/laundrybench/e2e
        run: npx playwright test tests/real-backend.spec.ts
      - name: Build and export the static Showcase
        working-directory: projects/laundrybench
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          VITE_SHOWCASE=1 npm --prefix frontend run build
          python scripts/build_showcase.py --output-dir frontend/dist --source-commit "$SOURCE_COMMIT"
      - name: Run browser acceptance against the static Showcase
        id: showcase-e2e
        working-directory: projects/laundrybench/e2e
        run: npx playwright test tests/showcase.spec.ts
      - name: Upload successful Showcase demo and trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laundrybench-showcase-demo
          path: |
            projects/laundrybench/e2e/test-results/**/showcase-demo.webm
            projects/laundrybench/e2e/test-results/**/showcase-trace.zip
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: laundrybench-browser-acceptance
          path: projects/laundrybench/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
